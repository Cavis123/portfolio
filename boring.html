<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>¿Aburrido? · Tower Blocks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Mini juego Tower Blocks del portfolio de Gabriel Lugo.">
  <meta name="theme-color" content="#d8d1cb">
  <link rel="canonical" href="https://universe-xt.com/boring.html">
  <link rel="stylesheet" href="assets/tower.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <a class="back-link" href="index.html">← Portfolio</a>
  <button class="tower-lang" id="towerLang" type="button" aria-label="Switch language">EN</button>

  <main id="towerContainer" class="tower-container loading">
    <div id="towerGame" class="tower-game" aria-hidden="true"></div>
    <div id="towerScore" class="tower-score">0</div>
    <div id="towerInstructions" class="tower-instructions">Click o espacio para colocar el bloque</div>

    <section class="tower-over">
      <h1>Game Over</h1>
      <p>Buen intento. La próxima torre sale mejor.</p>
      <form class="score-form" id="scoreForm">
        <label for="playerName">Guardar score</label>
        <div>
          <input id="playerName" name="playerName" type="text" maxlength="16" autocomplete="off" placeholder="Tu nombre">
          <button type="submit">Guardar</button>
        </div>
      </form>
      <p>Click o espacio para volver a empezar</p>
    </section>

    <section class="tower-ready">
      <button id="towerStart" type="button">Start</button>
      <p>Tower Blocks</p>
    </section>

    <aside class="rank-panel" aria-labelledby="rankTitle">
      <h2 id="rankTitle">Ranking</h2>
      <ol id="rankList"></ol>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="assets/tower.js"></script>
</body>
</html>
